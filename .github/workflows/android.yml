name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      versie:
        description: "Versie voor een nieuwe release met de APK, bijvoorbeeld v1.0 (leeg = geen release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Spellogica testen
        run: ./gradlew :engine:test

      - name: Ondertekensleutel klaarzetten
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          VERSIE: ${{ inputs.versie }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/tienopenneer.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/tienopenneer.p12" >> "$GITHUB_ENV"
          elif [ -n "$VERSIE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Het geheim SIGNING_KEY ontbreekt; zonder vaste sleutel installeert een update niet over de oude app heen."
            exit 1
          fi

      - name: APK bouwen
        run: ./gradlew :app:assembleRelease

      - name: APK hernoemen
        run: cp app/build/outputs/apk/release/app-release.apk tienopenneer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tienopenneer-apk
          path: tienopenneer.apk

      - name: Release maken bij een versietag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versie != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIE: ${{ inputs.versie || github.ref_name }}
        run: gh release create "$VERSIE" tienopenneer.apk --target "$GITHUB_SHA" --title "$VERSIE" --notes "APK om te installeren op Android (8.0 of nieuwer)."
