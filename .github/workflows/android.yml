name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      versie:
        description: "Versie voor een nieuwe release met de APK, bijvoorbeeld v1.0 (leeg = geen release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Spellogica testen
        run: ./gradlew :engine:test

      - name: APK bouwen
        run: ./gradlew :app:assembleDebug

      - name: APK hernoemen
        run: cp app/build/outputs/apk/debug/app-debug.apk tienopenneer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tienopenneer-apk
          path: tienopenneer.apk

      - name: Release maken bij een versietag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versie != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIE: ${{ inputs.versie || github.ref_name }}
        run: gh release create "$VERSIE" tienopenneer.apk --target "$GITHUB_SHA" --title "$VERSIE" --notes "APK om te installeren op Android (8.0 of nieuwer)."
