name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Spellogica testen
        run: ./gradlew :engine:test

      - name: APK bouwen
        run: ./gradlew :app:assembleDebug

      - name: APK hernoemen
        run: cp app/build/outputs/apk/debug/app-debug.apk tienopenneer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tienopenneer-apk
          path: tienopenneer.apk

      - name: Release maken bij een versietag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" tienopenneer.apk --title "${GITHUB_REF_NAME}" --notes "APK om te installeren op Android (8.0 of nieuwer)."
