name: Webversie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versienummers van app en website gelijk
        run: |
          web=$(sed -n 's/^const APP_VERSION = "\(.*\)";/\1/p' web/static/app.js)
          app=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "website $web, app $app"
          [ -n "$web" ] && [ "$web" = "$app" ]

      - name: Tests van de JavaScript (invoercontrole, ondertekening, gastheer)
        run: cd web && npm test

      - name: Website bouwen
        run: |
          ./gradlew :web:site
          # Hieraan ziet een geopende website dat er een nieuwe versie is
          web=$(sed -n 's/^const APP_VERSION = "\(.*\)";/\1/p' web/static/app.js)
          echo "{\"v\":\"$web\"}" > web/build/site/versie.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
